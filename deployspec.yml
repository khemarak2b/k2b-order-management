version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install -g @aws-amplify/cli@$AMPLIFY_CLI_VERSION
      - amplify --version
  build:
    commands:
      - ls -al
      - aws --version
      - aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
      - aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
      - aws configure set default.region $DEPLOYMENT_REGION
      - chmod +x ./deploy.sh
      - ./deploy.sh
    finally:
      - echo This is the finally block execution!
